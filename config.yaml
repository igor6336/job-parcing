# Конфигурация ежедневного парсера вакансий.
# Правится без изменения кода.

search:
  # Регион поиска в человекочитаемом виде (используется для локальной фильтрации).
  city_aliases: ["москва", "moscow", "мск", "удаленно", "удалённо", "remote"]

  # За сколько последних дней брать вакансии.
  period_days: 3

  # Максимум вакансий в одном дайджесте.
  max_results: 25

  # Максимально допустимый требуемый опыт в годах (там, где источник отдаёт число).
  max_experience_years: 2

  # Роль: хотя бы одно из этих сочетаний должно встретиться В НАЗВАНИИ вакансии.
  # Поиск по всему описанию давал мусор — слово «аналитика» попадается
  # в обязанностях почти любой офисной вакансии.
  # Совпадение идёт по началу слова: «аналитик» ловит «аналитика», «аналитику».
  role_keywords:
    - "финансовый аналитик"
    - "аналитик финанс"
    - "financial analyst"
    - "бизнес аналитик"
    - "business analyst"
    - "аналитик бизнес процессов"
    - "системный аналитик"
    - "system analyst"
    - "bi аналитик"
    - "bi analyst"
    - "аналитик bi"
    - "data analyst"
    - "аналитик данных"
    - "продуктовый аналитик"
    - "product analyst"
    - "инвестиционный аналитик"
    - "аналитик отчетности"
    - "аналитик мсфо"
    - "экономист аналитик"
    - "аналитик"          # широкий якорь, отсекается уровнем и стоп-словами
    - "analyst"
    - "аналитика"
    - "финанс"            # «Стажёр финансового отдела»
    - "экономист"
    - "отчетност"
    - "бизнес процесс"

  # Уровень: стажировка / джуниор. Проверяется по названию и описанию.
  level_keywords:
    - "стажировка"
    - "стажер"
    - "стажёр"
    - "стажировк"
    - "intern"
    - "internship"
    - "trainee"
    - "junior"
    - "джуниор"
    - "джун"
    - "младший"
    - "начинающий"
    - "без опыта"
    - "graduate"
    - "entry level"

  # Жёсткие стоп-слова в названии — вакансия отбрасывается.
  title_stopwords:
    - "senior"
    - "сеньор"
    - "ведущий"
    - "главный"
    - "старший"
    - "руководитель"
    - "начальник"
    - "team lead"
    - "teamlead"
    - "тимлид"
    - "директор"
    - "head of"
    - "архитектор"
    - "lead "
    - "менеджер по продажам"
    - "продавец"
    - "курьер"
    - "оператор call"
    - "оператор колл"
    - "консультант"       # «финансовый консультант» — почти всегда продажи
    - "страховой агент"
    - "кассир"

  # Стоп-фразы по требуемому опыту (ищутся в описании).
  experience_stopwords:
    - "опыт работы от 3"
    - "опыт работы от 4"
    - "опыт работы от 5"
    - "опыт от 3 лет"
    - "опыт от 4 лет"
    - "опыт от 5 лет"
    - "от 3 лет опыта"
    - "от 5 лет опыта"
    - "3+ years"
    - "5+ years"

sources:
  hh:
    enabled: true
    area: 1                       # 1 = Москва
    experience: ["noExperience", "between1And3"]
    max_pages: 3
    per_page: 100
    queries:
      - 'стажировка аналитик'
      - 'стажер аналитик'
      - '"финансовый аналитик" AND (junior OR младший OR стажер)'
      - '"бизнес-аналитик" AND (junior OR младший OR стажер)'
      - '"аналитик бизнес-процессов"'
      - '"BI-аналитик"'
      - '"системный аналитик" AND (junior OR стажер)'
      - '"аналитик данных" AND (junior OR стажер)'

  trudvsem:
    enabled: true
    region_code: "7700000000000"  # Москва
    max_pages: 2
    per_page: 100
    queries:
      - "аналитик"
      - "стажер аналитик"
      - "бизнес-аналитик"
      - "финансовый аналитик"

  habr:
    enabled: true
    # ID Москвы на career.habr.com. Проверьте в адресной строке сайта,
    # если источник начнёт возвращать нерелевантные города.
    city_id: 678
    max_pages: 2
    queries:
      - "аналитик"
      - "бизнес-аналитик"
      - "BI"

  getmatch:
    # Неофициальный JSON-эндпоинт, поиска по тексту нет: выкачиваем каталог
    # по городу и фильтруем локально. Junior-позиций на площадке мало.
    enabled: true
    location: "moscow"
    per_page: 100
    max_pages: 4

  superjob:
    # Требует бесплатный ключ: https://api.superjob.ru/register
    # Секрет SUPERJOB_API_KEY. Без ключа источник молча пропускается.
    enabled: true
    town: 4                       # 4 = Москва
    experience: [1, 2]            # 1 = нет опыта, 2 = от 1 года
    max_pages: 2
    per_page: 100
    queries:
      - "аналитик стажер"
      - "бизнес-аналитик junior"
      - "финансовый аналитик junior"

dedup:
  state_file: "state/seen.json"
  ttl_days: 60

telegram:
  # Заголовок дайджеста.
  header: "📊 Вакансии: стажировки и junior-аналитика (Москва)"
  # Сообщение, если за сутки ничего нового.
  empty_message: "Сегодня новых подходящих вакансий не нашлось."
  # Отправлять ли сообщение при пустом результате.
  notify_when_empty: true
