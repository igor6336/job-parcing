# Конфигурация ежедневного парсера вакансий.
# Правится без изменения кода.

search:
  # Регион поиска в человекочитаемом виде (используется для локальной фильтрации).
  city_aliases:
    # Совпадение идёт по началу слова, поэтому «москв» покрывает и «Москва»,
    # и «Московская область», и «Агломерация Москвы» из выдачи LinkedIn.
    - "москв"
    - "moscow"
    - "мск"
    - "удаленно"
    - "удалённо"
    - "remote"

  # За сколько последних дней брать вакансии. Для стажировок окно шире,
  # чем для обычных вакансий: их публикуют реже, а висят они дольше.
  # Повторов это не создаёт — дедупликация помнит отправленное 60 дней.
  period_days: 7

  # Максимум вакансий в одном дайджесте.
  max_results: 25

  # Максимально допустимый требуемый опыт в годах (там, где источник отдаёт число).
  max_experience_years: 2

  # Минимальный балл соответствия. Ниже — вакансия не попадёт в дайджест.
  # Поднимите, если приходит слишком много неточных совпадений.
  min_score: 16

  # Роль в НАЗВАНИИ вакансии → вес. Веса расставлены под профиль резюме:
  # бизнес-анализ (BPMN/Visio), BI (Power Query, DataLens), финансы.
  # Побеждает самое точное совпадение, а не первое найденное.
  # Совпадение идёт по началу слова: «аналитик» ловит «аналитика», «аналитику».
  role_keywords:
    # Ядро профиля — прямое попадание в опыт и навыки.
    "бизнес аналитик": 9
    "business analyst": 9
    "аналитик бизнес процессов": 9
    "процессный аналитик": 9
    "bi аналитик": 9
    "аналитик bi": 9
    "bi analyst": 9
    "финансовый аналитик": 8
    "аналитик финанс": 8
    "financial analyst": 8
    "аналитик отчетности": 8
    "экономист аналитик": 7
    "инвестиционный аналитик": 7
    "аналитик мсфо": 7

    # Смежное: подходит, но требует того, что в резюме на базовом уровне.
    "аналитик данных": 5      # обычно нужен уверенный SQL
    "data analyst": 5
    # Системный и продуктовый аналитик исключены сознательно: там нужны
    # программирование, UML, API и A/B-тесты — этого в резюме нет.
    # Чтобы вернуть, добавьте сюда строку с весом 4–5.

    # Широкие якори — ловят формулировки вроде «Стажёр отдела аналитики».
    "аналитик": 3
    "аналитика": 3
    "analyst": 3
    "финанс": 3
    "экономист": 3
    "отчетност": 3
    "бизнес процесс": 5

  # Навыки из резюме: совпадение в требованиях поднимает вакансию.
  skill_keywords:
    "bpmn": 3
    "visio": 2
    "power query": 3
    "datalens": 3
    "power bi": 2
    "сводные таблиц": 2
    "excel": 2
    "sql": 2
    "бизнес процесс": 2
    "моделирование процесс": 2
    "дашборд": 2
    "отчетност": 1
    "финансовый анализ": 2
    "agile": 1

  # Чего в резюме нет: не отсекаем (часто это «будет плюсом»),
  # но опускаем в очереди — такие вакансии дороже по времени на отклик.
  skill_gaps:
    "python": -2
    "pandas": -2
    "airflow": -3
    "clickhouse": -2
    "spark": -3
    "hadoop": -3
    "java": -3
    "c#": -3
    "1с": -3
    "1c": -3
    "sap": -2
    "etl": -2
    "dwh": -2
    "uml": -1
    "микросервис": -2
    "machine learning": -3
    "машинное обучение": -3

  # График, совместимый с учёбой (заявлено 20–30 ч/нед).
  # Только бонус, без отсечения: RSS-фид hh график не отдаёт вообще,
  # и жёсткий фильтр вырезал бы главный источник целиком.
  schedule_bonus:
    "неполн": 5
    "частичная занятость": 5
    "гибкий график": 4
    "стажировка": 3
    "удаленн": 2
    "удалённ": 2
    "проектная": 1
    "полный день": -1
    "полная занятость": -1

  # Уровень. Стажировка и junior разведены намеренно: при занятости
  # 20–30 ч/нед junior на полный день чаще всего не подходит, поэтому
  # стажировка весит заметно больше.
  internship_weight: 9
  junior_weight: 2

  internship_keywords:
    - "стажировка"
    - "стажировк"
    - "стажер"
    - "стажёр"
    - "intern"
    - "internship"
    - "trainee"
    - "практикант"
    - "практика"
    - "ученик"

  junior_keywords:
    - "junior"
    - "джуниор"
    - "джун"
    - "младший"
    - "начинающий"
    - "без опыта"
    - "graduate"
    - "entry level"
    - "помощник"
    - "ассистент"

  # Жёсткие стоп-слова в названии — вакансия отбрасывается.
  title_stopwords:
    - "senior"
    - "сеньор"
    - "ведущий"
    - "главный"
    - "старший"
    - "руководитель"
    - "начальник"
    - "team lead"
    - "teamlead"
    - "тимлид"
    - "директор"
    - "head of"
    - "архитектор"
    - "lead "
    - "менеджер по продажам"
    - "продавец"
    - "курьер"
    - "оператор call"
    - "оператор колл"
    - "кадров"            # «HR-аналитика» — другая профессия
    - "делопроизводств"
    - "hr"
    - "консультант"       # «финансовый консультант» — почти всегда продажи
    - "страховой агент"
    - "кассир"
    # Роли, где ядро работы — программирование или IT-интеграции.
    - "системный аналитик"
    - "system analyst"
    - "разработчик"
    - "developer"
    - "программист"
    - "инженер"
    - "engineer"
    - "тестировщик"
    - "qa"
    - "devops"
    - "1с"
    - "1c"               # латиницей пишут не реже, чем кириллицей

  # Стоп-фразы по требуемому опыту (ищутся в описании).
  experience_stopwords:
    - "опыт работы от 3"
    - "опыт работы от 4"
    - "опыт работы от 5"
    - "опыт от 3 лет"
    - "опыт от 4 лет"
    - "опыт от 5 лет"
    - "от 3 лет опыта"
    - "от 5 лет опыта"
    - "3+ years"
    - "5+ years"

  # Требования, которые закрывают вакансию при текущем уровне (английский B1).
  requirement_stopwords:
    - "английский c1"
    - "английский с1"
    - "английский язык c1"
    - "english c1"
    - "advanced english"
    - "fluent english"
    - "свободный английский"
    - "свободное владение английским"
    - "английский upper"
    - "upper intermediate английск"

sources:
  hh:
    # Работает через RSS-выдачу поиска: публичный API вакансий hh закрыл
    # в апреле 2026 (403 для всех неавторизованных). Подробности в README.
    # Фид отдаёт 20 вакансий на страницу; графика и требований в нём нет.
    enabled: true
    area: 1                       # 1 = Москва
    search_field: "name"          # искать только в названии — иначе фид шумит
    max_pages: 3

    # Режимы поиска. Фид уважает employment и schedule (experience — нет),
    # поэтому стажировки запрашиваются напрямую, а не вылавливаются по слову
    # в заголовке. bonus — прибавка к баллу: площадка подтвердила тип
    # занятости, даже если в названии об этом ни слова.
    # Проверено на живой выдаче: employment=probation и schedule=flexible
    # действительно меняют результат, а schedule=partTime — нет (17 из 20
    # вакансий совпадают с обычным поиском), поэтому его здесь нет.
    #
    # confirms_level: true ставится только там, где площадка гарантирует тип
    # занятости. Иначе обычные вакансии на полный день получали бы бонус
    # и обходили проверку уровня — ровно это и случилось с partTime.
    query_profiles:
      - note: "стажировка"
        bonus: 9
        confirms_level: true
        params:
          employment: "probation"
      - note: "гибкий график"
        bonus: 3
        confirms_level: false
        params:
          schedule: "flexible"
      - note: "обычный поиск"
        bonus: 0
        confirms_level: false
        params: {}

    queries:
      - "стажер аналитик"
      - "стажировка аналитик"
      - "аналитик"
      - "младший аналитик"
      - "финансовый аналитик"
      - "бизнес-аналитик"
      - "аналитик бизнес-процессов"
      - "BI-аналитик"
      - "экономист"

  linkedin:
    # Гостевой эндпоинт, не официальное API. По Москве выдача тонкая:
    # LinkedIn заблокирован в РФ, публикуются в основном международные
    # компании. Читайте раздел README про LinkedIn перед использованием.
    enabled: true
    location: "Moscow, Russia"
    max_pages: 2
    pause_seconds: 1.5
    queries:
      - "analyst intern"
      - "junior analyst"
      - "financial analyst"
      - "business analyst"
      - "аналитик"

  trudvsem:
    enabled: true
    region_code: "7700000000000"  # Москва
    max_pages: 2
    per_page: 100
    queries:
      - "аналитик"
      - "стажер аналитик"
      - "стажировка"
      - "практикант"
      - "бизнес-аналитик"
      - "финансовый аналитик"
      - "экономист"

  habr:
    enabled: true
    # ID Москвы на career.habr.com. Проверьте в адресной строке сайта,
    # если источник начнёт возвращать нерелевантные города.
    city_id: 678
    max_pages: 2
    queries:
      - "аналитик"
      - "бизнес-аналитик"
      - "BI"
      - "стажер"
      - "стажировка"

  getmatch:
    # Неофициальный JSON-эндпоинт, поиска по тексту нет: выкачиваем каталог
    # по городу и фильтруем локально. Junior-позиций на площадке мало.
    enabled: true
    location: "moscow"
    per_page: 100
    max_pages: 4

  superjob:
    # Требует бесплатный ключ: https://api.superjob.ru/register
    # Секрет SUPERJOB_API_KEY. Без ключа источник молча пропускается.
    enabled: true
    town: 4                       # 4 = Москва
    experience: [1, 2]            # 1 = нет опыта, 2 = от 1 года
    max_pages: 2
    per_page: 100
    queries:
      - "аналитик стажер"
      - "бизнес-аналитик junior"
      - "финансовый аналитик junior"

dedup:
  state_file: "state/seen.json"
  ttl_days: 60

telegram:
  # Заголовок дайджеста.
  header: "📊 Вакансии: стажировки и junior-аналитика (Москва)"
  # Сообщение, если за сутки ничего нового.
  empty_message: "Сегодня новых подходящих вакансий не нашлось."
  # Отправлять ли сообщение при пустом результате.
  notify_when_empty: true
